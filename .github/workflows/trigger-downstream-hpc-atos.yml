        pull-request: ${{ needs.context.outputs.pull-request }}
        level: ${{ inputs.level }}
    needs:
    - ci-approval
    - context
  validate:
    if: ${{ (needs.context.outputs.ci-conclusion == 'success') && needs['label-gate'].outputs.run == 'true' }}
