name: publish-crates

# A release tag dry-runs the crates as a sanity check; publishing is manual only: dispatch on any ref with mode=publish.
# The -sys crates build their C++ from the tag of the workspace version, so a dry run fails until that tag exists.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [dry-run, publish]
        default: dry-run

permissions:
  contents: read

jobs:
  resolve:
    # runs-on: arc-runner-normal  # ARC runners off
    runs-on: ubuntu-latest
    container:
      image: eccr.ecmwf.int/public-ci-images/ubuntu24.04-base:latest
    outputs:
      matrix: ${{ toJSON(fromJSON(steps.r.outputs.json)['rust-publish']) }}
    steps:
      - name: Announce image
        uses: ecmwf/ci-infrastructure/actions/announce-image@main
      - id: mint
        uses: ecmwf/ci-infrastructure/actions/mint-token@main
        with:
          client-id: ${{ secrets.CI_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_READER_APP_PRIVATE_KEY }}
          repositories: ecbuild,eccodes,eckit,stack-dependencies
          permissions: contents:read actions:read
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: r
        uses: ecmwf/ci-infrastructure/actions/resolve-deps@main
        with:
          matrix: rust-publish
          token: ${{ steps.mint.outputs.token }}

  publish:
    needs: resolve
    name: publish (${{ matrix._resolved['job-name'] }})
    runs-on: ${{ matrix['runs-on'] }}
    environment: ${{ inputs.mode == 'publish' && 'crates-io' || '' }}
    permissions:
      contents: read
      id-token: write
    container:
      image: ${{ matrix.container }}
    strategy:
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Announce image
        uses: ecmwf/ci-infrastructure/actions/announce-image@main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: auth
        if: inputs.mode == 'publish'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish the crates
        uses: ecmwf/ci-infrastructure/actions/run-job-script@main
        env:
          CI_CARGO_PUBLISH: ${{ inputs.mode == 'publish' && 'publish' || 'dry-run' }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        with:
          job-script: ${{ matrix.job-script }}
          matrix-leg: ${{ toJSON(matrix) }}
          package: eccodes-crates
