name: publish-crates

# A release tag dry-runs the crates as a sanity check; publishing is manual only: dispatch on any ref with mode=publish.
# The -sys crates build their C++ from the tag of the workspace version, so a dry run fails until that tag exists.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [dry-run, publish]
        default: dry-run

permissions:
  contents: read

jobs:
  resolve:
    runs-on: arc-runner-normal
    container:
      image: eccr.ecmwf.int/public-ci-images/ubuntu24.04-base:latest
    outputs:
      matrix: ${{ toJSON(fromJSON(steps.r.outputs.json)['rust-publish']) }}
    steps:
      - name: Announce image
        uses: ecmwf/ci-infrastructure/actions/announce-image@main
      - id: mint
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CI_PERMISSIONS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_PERMISSIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: r
        uses: ecmwf/ci-infrastructure/actions/resolve-deps@main
        with:
          matrix: rust-publish
          token: ${{ steps.mint.outputs.token }}
          client-id: ${{ secrets.CI_PERMISSIONS_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.CI_PERMISSIONS_APP_PRIVATE_KEY }}

  publish:
    needs: resolve
    name: publish (${{ matrix._resolved['job-name'] }})
    runs-on: ${{ matrix['runs-on'] }}
    container:
      image: ${{ matrix.container }}
    strategy:
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Announce image
        uses: ecmwf/ci-infrastructure/actions/announce-image@main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Publish the crates
        uses: ecmwf/ci-infrastructure/actions/run-job-script@main
        env:
          CI_CARGO_PUBLISH: ${{ inputs.mode == 'publish' && 'publish' || 'dry-run' }}
          CARGO_REGISTRY_TOKEN: ${{ inputs.mode == 'publish' && secrets.CARGO_REGISTRY_TOKEN || '' }}
        with:
          job-script: ${{ matrix.job-script }}
          matrix-leg: ${{ toJSON(matrix) }}
          package: eccodes-crates
