name: CI

on:
  push:
    branches: [develop, master]
    paths-ignore:
      - "deprecated/**"
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    paths-ignore:
      - "deprecated/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ARTIFACT_POLL_INTERVAL: ${{ vars.ARTIFACT_POLL_INTERVAL || '60' }}
  ARTIFACT_S3_ENDPOINT: ${{ secrets.ARTIFACT_S3_ENDPOINT }}
  ARTIFACT_S3_BUCKET: ${{ secrets.ARTIFACT_S3_BUCKET }}
  SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

permissions:
  contents: read

jobs:
  ci-approval:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
      - uses: ecmwf/ci-infrastructure/actions/require-ci-approval@main

  resolve:
    needs: ci-approval
    runs-on: arc-runner-normal
    container:
      image: eccr.ecmwf.int/public-ci-images/ubuntu24.04-base:latest
    outputs:
      build-matrix: ${{ steps.r.outputs.matrix-build }}
      build-hpc-matrix: ${{ steps.r.outputs.matrix-build-hpc }}
    steps:
      - name: Announce image
        uses: ecmwf/ci-infrastructure/actions/announce-image@main
      - id: mint
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_PERMISSIONS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_PERMISSIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
      - id: r
        uses: ecmwf/ci-infrastructure/actions/resolve-deps@main
        with:
          current-branch: ${{ github.head_ref || github.ref_name }}
          matrix: build,build-hpc
          token: ${{ steps.mint.outputs.token }}
          client-id: ${{ secrets.CI_PERMISSIONS_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.CI_PERMISSIONS_APP_PRIVATE_KEY }}

  build:
    needs: [ci-approval, resolve]
    name: build+test (${{ matrix.platform }}, ${{ matrix.cxx-compiler }}, ${{ matrix.options || 'default' }})
    runs-on: ${{ matrix['runs-on'] }}
    container:
      image: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.build-matrix) }}
    steps:
      - name: Announce image
        uses: ecmwf/ci-infrastructure/actions/announce-image@main
      - id: mint
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_PERMISSIONS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_PERMISSIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}

      - name: Fetch resolved deps
        id: deps
        uses: ecmwf/ci-infrastructure/actions/fetch-and-publish@main
        with:
          mode: download-only
          deps-json: ${{ toJSON(matrix._resolved.deps) }}
          token: ${{ steps.mint.outputs.token }}

      - name: Build eccodes
        id: build
        uses: ./.github/actions/build-eccodes
        with:
          cmake-prefix-path: ${{ steps.deps.outputs.cmake-prefix-path }}
          cxx-compiler: ${{ matrix.cxx-compiler }}
          fortran-compiler: ${{ matrix.fortran-compiler }}
          build-type: ${{ matrix.build-type }}
          options: ${{ matrix.options }}

      - name: Print dependency table
        uses: ecmwf/ci-infrastructure/actions/print-dep-table@main
        with:
          resolved-json: ${{ toJSON(matrix._resolved) }}

      # Invocation comes from .ci/manifest.toml's [matrix.build], the same place
      # the generated cross-repo-trigger.yml renders its Test step from. Spelling
      # it out again here is how the two lanes drift apart.
      - name: Test
        if: ${{ matrix._resolved.ctest }}
        run: ctest --test-dir "${{ steps.build.outputs.build-dir }}" --output-on-failure ${{ matrix._resolved['ctest-args'] }}

      - name: Publish eccodes
        uses: ecmwf/ci-infrastructure/actions/fetch-and-publish@main
        with:
          mode: publish
          install-path: ${{ steps.build.outputs.install-path }}
          artifact-name: ${{ matrix._resolved.own-artifact-name }}

  build-hpc:
    needs: [ci-approval, resolve]
    name: build-hpc (${{ matrix.platform }}, ${{ matrix.options || 'default' }})
    runs-on: ${{ matrix['runs-on'] }}
    container:
      image: ${{ matrix.container }}
      credentials:
        username: ${{ secrets.ECCR_PULL_ROBOT_NAME }}
        password: ${{ secrets.ECCR_PULL_ROBOT_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.build-hpc-matrix) }}
    steps:
      - name: Announce image
        uses: ecmwf/ci-infrastructure/actions/announce-image@main
      - id: mint
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_PERMISSIONS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_PERMISSIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}

      - name: Fetch resolved deps
        id: deps
        uses: ecmwf/ci-infrastructure/actions/fetch-and-publish@main
        with:
          mode: download-only
          deps-json: ${{ toJSON(matrix._resolved.deps) }}
          token: ${{ steps.mint.outputs.token }}
          # Stage the dep prefixes for shipment without installing anything
          # here: they are consumed on the compute node, not in this container.
          install-python-deps: 'false'

      - name: Build eccodes on HPC
        uses: ecmwf/ci-infrastructure/actions/build-on-hpc@main
        with:
          site: ${{ matrix.site }}
          job-script: ${{ matrix.job-script || './.ci/hpc/build-gnu.sh' }}
          artifact-name: ${{ matrix._resolved.own-artifact-name }}
          cmake-prefix-path: ${{ steps.deps.outputs.cmake-prefix-path }}
          work-dir: ${{ vars.HPC_CI_WORK_DIR }}
          remote-work-dir: ${{ vars.HPC_CI_REMOTE_WORK_DIR }}
          troika-user: ${{ secrets.HPC_CI_SSH_USER }}
