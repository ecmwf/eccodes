[package]
name = "eccodes"
repo = "ecmwf/eccodes"
visibility = "public"
compiler-inputs = ["cxx-compiler"]

[[deps]]
repo = "ecmwf/ecbuild"
package = "ecbuild"
ref = "develop"
compiler-inputs = []

[[deps]]
repo = "ecmwf/stack-dependencies"
package = ["libaec", "netcdf"]
ref = "master"
compiler-inputs = ["cxx-compiler"]

[[deps]]
repo = "ecmwf/eckit"
package = "eckit"
ref = "develop"
compiler-inputs = ["cxx-compiler"]
when = { options = ["eckit-geo"] }

# eccodes with its Fortran interface, named by the Fortran compiler too, since
# Fortran modules only work with the compiler that wrote them. Plain eccodes is
# built without Fortran.
[packages.eccodes-fortran]
compiler-inputs = ["cxx-compiler", "fortran-compiler"]

[[packages.eccodes-fortran.deps]]
repo = "ecmwf/ecbuild"
package = "ecbuild"
ref = "develop"
compiler-inputs = []

[[packages.eccodes-fortran.deps]]
repo = "ecmwf/stack-dependencies"
package = ["libaec", "netcdf"]
ref = "master"
compiler-inputs = ["cxx-compiler"]

[[packages.eccodes-fortran.deps]]
repo = "ecmwf/eckit"
package = "eckit"
ref = "develop"
compiler-inputs = ["cxx-compiler"]
when = { options = ["eckit-geo"] }

[matrix.build.defaults]
job-script = "./.ci/build.sh.j2"
build-type = "RelWithDebInfo"
runs-on = "arc-runner-very-large"

[[matrix.build.include]]
cxx-compiler = "clang++-18"
c-compiler = "clang-18"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-clang18:latest"
platform = "ubuntu-24.04"

[[matrix.build.include]]
cxx-compiler = "g++-13"
c-compiler = "gcc-13"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gcc13-gfortran13:latest"
platform = "ubuntu-24.04"

[[matrix.build.include]]
cxx-compiler = "g++-13"
c-compiler = "gcc-13"
options = "eckit-geo"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gcc13-gfortran13:latest"
platform = "ubuntu-24.04"

[matrix.build]
packages = ["eccodes"]
triggers = ["upstream-change", "rebuild-request"]

[matrix.fortran.defaults]
job-script = "./.ci/build.sh.j2"
build-type = "RelWithDebInfo"
runs-on = "arc-runner-very-large"
cxx-compiler = "g++-13"
c-compiler = "gcc-13"
fortran-compiler = "gfortran-13"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gcc13-gfortran13:latest"
platform = "ubuntu-24.04"

[[matrix.fortran.include]]
options = ""

[matrix.fortran]
packages = ["eccodes-fortran"]
triggers = ["upstream-change", "rebuild-request"]

[matrix.build-hpc.defaults]
cxx-compiler = "g++-8"
build-type = "RelWithDebInfo"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-gnu"
# gcc/old, not a version number: as of now gives you 8.5.0
# `module avail gcc` lists no 8.5.0 to pin directly.
modules = ["load prgenv/gnu", "unload gcc", "load gcc/old", "load cmake", "load ninja"]
c-compiler-binary = "gcc"
cxx-compiler-binary = "g++"
time = "01:30:00"
job-script = "./.ci/build.sh.j2"

[[matrix.build-hpc.include]]
options = ""

[[matrix.build-hpc.include]]
options = "eckit-geo"

[matrix.build-hpc]
packages = ["eccodes"]
execution = "hpc-atos"
container-credentials = true
triggers = ["upstream-change", "rebuild-request"]

[matrix.fortran-hpc.defaults]
cxx-compiler = "g++-8"
fortran-compiler = "gfortran-8"
build-type = "RelWithDebInfo"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-gnu"
modules = ["load prgenv/gnu", "unload gcc", "load gcc/old", "load cmake", "load ninja"]
c-compiler-binary = "gcc"
cxx-compiler-binary = "g++"
fortran-compiler-binary = "gfortran"
time = "01:30:00"
job-script = "./.ci/build.sh.j2"

[[matrix.fortran-hpc.include]]
options = ""

[matrix.fortran-hpc]
packages = ["eccodes-fortran"]
execution = "hpc-atos"
container-credentials = true
triggers = ["upstream-change", "rebuild-request"]
