[package]
name = "eccodes"
repo = "ecmwf/eccodes"
visibility = "public"
compiler-inputs = ["cxx-compiler"]
git-read = ["ecmwf/bindman"]

[[deps]]
repo = "ecmwf/ecbuild"
package = "ecbuild"
ref = "develop"
compiler-inputs = []

[[deps]]
repo = "ecmwf/stack-dependencies"
package = ["libaec", "netcdf"]
ref = "master"
compiler-inputs = ["cxx-compiler"]

[[deps]]
repo = "ecmwf/eckit"
package = "eckit"
ref = "develop"
compiler-inputs = ["cxx-compiler"]
when = { options = ["eckit-geo"] }

# eccodes with its Fortran interface, named by the Fortran compiler too, since
# Fortran modules only work with the compiler that wrote them. Plain eccodes is
# built without Fortran.
[packages.eccodes-fortran]
compiler-inputs = ["cxx-compiler", "fortran-compiler"]

# A second full eccodes build, so it needs eccodes' own deps rather than eccodes.
# Once the Fortran interface builds against an installed eccodes, it depends on
# eccodes alone: https://github.com/ecmwf/eccodes/issues/597

[[packages.eccodes-fortran.deps]]
repo = "ecmwf/ecbuild"
package = "ecbuild"
ref = "develop"
compiler-inputs = []

[[packages.eccodes-fortran.deps]]
repo = "ecmwf/stack-dependencies"
package = ["libaec", "netcdf"]
ref = "master"
compiler-inputs = ["cxx-compiler"]

[[packages.eccodes-fortran.deps]]
repo = "ecmwf/eckit"
package = "eckit"
ref = "develop"
compiler-inputs = ["cxx-compiler"]
when = { options = ["eckit-geo"] }

[matrix.build.defaults]
job-script = "./.ci/build.sh.j2"
build-type = "RelWithDebInfo"
runs-on = "arc-runner-very-large"

[[matrix.build.include]]
cxx-compiler = "clang++-18"
c-compiler = "clang-18"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-clang18:latest"
platform = "ubuntu-24.04"

[[matrix.build.include]]
cxx-compiler = "g++-13"
c-compiler = "gcc-13"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gcc13-gfortran13:latest"
platform = "ubuntu-24.04"

[[matrix.build.include]]
cxx-compiler = "g++-13"
c-compiler = "gcc-13"
options = "eckit-geo"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gcc13-gfortran13:latest"
platform = "ubuntu-24.04"

[[matrix.build.include]]
runs-on = "arc-runner-very-large"
cxx-compiler = "g++-15"
c-compiler = "gcc-15"
container = "eccr.ecmwf.int/public-ci-images/ubuntu26.04-gcc15-gfortran15"
platform = "ubuntu-26.04"

[[matrix.build.include]]
runs-on = "arc-runner-very-large"
cxx-compiler = "g++-8"
c-compiler = "gcc-8"
container = "eccr.ecmwf.int/public-ci-images/rocky8-gcc8-gfortran8"
platform = "rocky-8"

[[matrix.build.include]]
runs-on = "arc-runner-very-large"
cxx-compiler = "g++-11"
c-compiler = "gcc-11"
container = "eccr.ecmwf.int/public-ci-images/rocky9-gcc11-gfortran11"
platform = "rocky-9"

[[matrix.build.include]]
runs-on = "arc-runner-very-large"
cxx-compiler = "g++-14"
c-compiler = "gcc-14"
container = "eccr.ecmwf.int/public-ci-images/rocky10-gcc14-gfortran14"
platform = "rocky-10"

[[matrix.build.include]]
runs-on = "arc-runner-normal"
cxx-compiler = "g++-10"
c-compiler = "gcc-10"
container = "eccr.ecmwf.int/public-ci-images/debian11-gcc10-gfortran10"
platform = "debian-11"

[[matrix.build.include]]
runs-on = "arc-runner-normal"
cxx-compiler = "g++-12"
c-compiler = "gcc-12"
container = "eccr.ecmwf.int/public-ci-images/debian12-gcc12-gfortran12"
platform = "debian-12"

[[matrix.build.include]]
runs-on = "arc-runner-normal"
cxx-compiler = "g++-14"
c-compiler = "gcc-14"
container = "eccr.ecmwf.int/public-ci-images/debian13-gcc14-gfortran14"
platform = "debian-13"

[matrix.build]
packages = ["eccodes"]
triggers = ["upstream-change", "rebuild-request"]

[matrix.fortran.defaults]
job-script = "./.ci/build.sh.j2"
build-type = "RelWithDebInfo"
runs-on = "arc-runner-very-large"
cxx-compiler = "g++-13"
c-compiler = "gcc-13"
fortran-compiler = "gfortran-13"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gcc13-gfortran13:latest"
platform = "ubuntu-24.04"

[[matrix.fortran.include]]

[matrix.fortran]
packages = ["eccodes-fortran"]
triggers = ["upstream-change", "rebuild-request"]

[matrix.build-hpc.defaults]
cxx-compiler = "g++-8"
build-type = "RelWithDebInfo"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-gnu"
# gcc/old, not a version number: as of now gives you 8.5.0
# `module avail gcc` lists no 8.5.0 to pin directly.
modules = ["load prgenv/gnu", "unload gcc", "load gcc/old", "load cmake", "load ninja"]
c-compiler-binary = "gcc"
cxx-compiler-binary = "g++"
time = "01:30:00"
job-script = "./.ci/build.sh.j2"

[[matrix.build-hpc.include]]

[[matrix.build-hpc.include]]
options = "eckit-geo"

[matrix.build-hpc]
packages = ["eccodes"]
execution = "hpc-atos"
container-credentials = true
triggers = ["upstream-change", "rebuild-request"]

[matrix.fortran-hpc.defaults]
cxx-compiler = "g++-8"
fortran-compiler = "gfortran-8"
build-type = "RelWithDebInfo"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools:latest"
site = "hpc-batch"
platform = "hpc-atos-gnu"
modules = ["load prgenv/gnu", "unload gcc", "load gcc/old", "load cmake", "load ninja"]
c-compiler-binary = "gcc"
cxx-compiler-binary = "g++"
fortran-compiler-binary = "gfortran"
time = "01:30:00"
job-script = "./.ci/build.sh.j2"

[[matrix.fortran-hpc.include]]

[matrix.fortran-hpc]
packages = ["eccodes-fortran"]
execution = "hpc-atos"
container-credentials = true
triggers = ["upstream-change", "rebuild-request"]

[packages.eccodes-rust]
compiler-inputs = ["cxx-compiler"]

[[packages.eccodes-rust.deps]]
package = "eccodes"
options-input = "options"

[[packages.eccodes-rust.deps]]
repo = "ecmwf/eckit"
package = "eckit"
ref = "develop"
compiler-inputs = ["cxx-compiler"]

[matrix.rust]
packages = ["eccodes-rust"]
publishes = false

[matrix.rust.defaults]
job-script = "./.ci/rust.sh.j2"
runs-on = "arc-runner-normal"
build-type = "RelWithDebInfo"
cxx-compiler = "g++-13"
c-compiler = "gcc-13"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gcc13-gfortran13-boost-qt6-rust1.90"
platform = "ubuntu-24.04"

[[matrix.rust.include]]
rust-compiler = "rust-1.90"
