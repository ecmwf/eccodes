[workspace]
resolver = "2"
members = ["crates/eccodes-sys", "crates/eccodes", "examples/eccodes-example"]

[workspace.package]
version      = "2.50.0"
edition      = "2024"
license      = "Apache-2.0"
repository   = "https://github.com/ecmwf/eccodes"
rust-version = "1.90"

[workspace.dependencies]
bindman-utils = "0.2"

eccodes-sys = { version = "2.50", path = "crates/eccodes-sys", default-features = false, features = ["product-grib", "product-bufr", "geography", "jpg"] }

eckit-sys = { version = "2.5", default-features = false }
