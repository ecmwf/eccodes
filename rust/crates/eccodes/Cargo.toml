[package]
name         = "eccodes"
version      = "0.1.0"
edition      .workspace = true
license      .workspace = true
repository   .workspace = true
rust-version .workspace = true
description  = "Safe Rust wrapper for ECMWF's eccodes (GRIB/BUFR)"

[features]
default = ["vendored"]

# Build strategy (mutually exclusive) — pass-through to eccodes-sys.
# `vendored` forces `threads` on: the `Send` impl on `Handle` relies on
# libeccodes locking its global context internally.
system   = ["eccodes-sys/system"]
vendored = ["eccodes-sys/vendored", "threads"]

# Expose `Message::as_raw` and re-export `eccodes_sys`, for handing a message
# to another C library built on eccodes.
raw = []

# POSIX-threads locking inside libeccodes (`ENABLE_ECCODES_THREADS`).
# No-op for `system` builds — there it is on the user to link a library
# built with it.
threads = ["eccodes-sys/eccodes-threads"]

[dependencies]
eccodes-sys.workspace = true

bitflags  = "2"
thiserror = "2"
libc      = "0.2"
# The bridge for the C library's own diagnostics — `Logging::Rust`. A facade,
# so the application picks the backend, as `eckit::init` does for eckit::Log.
log       = "0.4"
# Dates and times in the public API: `time::Date`/`Time` are what message
# keys decode to. Chosen over chrono/jiff for native Julian-day support.
time      = "0.3"

[dev-dependencies]
# Fetches optional golden-value fixtures from the ECMWF test-data server.
ureq = "3"
