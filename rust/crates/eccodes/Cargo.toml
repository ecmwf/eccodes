[package]
name         = "eccodes"
version      = "2.49.0"
edition      .workspace = true
license      .workspace = true
repository   .workspace = true
rust-version .workspace = true
description  = "Safe Rust wrapper for ECMWF's eccodes (GRIB/BUFR)"

[features]
default = ["vendored"]

# Build strategy (mutually exclusive) — pass-through to eccodes-sys
system   = ["eccodes-sys/system"]
vendored = ["eccodes-sys/vendored"]

[dependencies]
eccodes-sys.workspace = true

bitflags  = "2"
thiserror = "2"
libc      = "0.2"
