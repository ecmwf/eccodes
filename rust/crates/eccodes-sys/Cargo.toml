[package]
name         = "eccodes-sys"
version      = "2.48.0"
edition      .workspace = true
license      .workspace = true
repository   .workspace = true
rust-version .workspace = true
description  = "Raw FFI bindings to the ECMWF eccodes C library"
links        = "eccodes_sys"
build        = "build.rs"

[features]
# Defaults mirror eccodes CMake defaults except `vendored`, `netcdf`,
# and `memfs` — which require extra setup or external libs.
default = ["product-grib", "product-bufr", "geography", "jpg", "vendored"]

# Build strategy (mutually exclusive)
system   = ["eckit-sys/system"]
vendored = ["eckit-sys/vendored"]

# Format support (CMake default: ON)
product-grib = []
product-bufr = []

# Geospatial (CMake default: ON)
geography = []

# Compression codecs
aec = []   # CMake default ON
jpg = []   # CMake default ON
png = []   # CMake default OFF

# Optional
netcdf = []   # requires system NetCDF
memfs  = []   # bakes definitions/samples into libeccodes

# Threading (mutually exclusive, CMake default OFF)
eccodes-threads     = []
eccodes-omp-threads = []

[dependencies]
eckit-sys.workspace = true

[build-dependencies]
bindman-utils.workspace = true
bindgen  = "0.72"
fs_extra = "1.3"
