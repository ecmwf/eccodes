[package]
name = "eccodes-sys"
version = "2.48.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "FFI bindings to ECMWF eccodes library"
links = "eccodes_sys"
build = "build.rs"

[features]
# Defaults match CMake defaults (except build-tools, netcdf which require external libs)
default = ["vendored", "product-grib", "product-bufr", "geography", "aec", "jpg"]

# Build strategy (mutually exclusive)
vendored = ["eckit-sys/vendored"]
system = ["eckit-sys/system"]

# Format support (CMake default: ON)
product-grib = []  # GRIB format support
product-bufr = []  # BUFR format support

# Geospatial (CMake default: ON)
geography = []  # Geographic support (projections, coordinates)

# Compression codecs
aec = []  # AEC compression support (CMake default: ON)
jpg = []  # JPEG2000 compression support (CMake default: ON)
png = []  # PNG compression support (CMake default: OFF)

# Additional features
netcdf = []  # NetCDF format support (requires NetCDF library)
memfs = []   # Memory filesystem support (requires Python3)

# Threading (mutually exclusive, CMake default: OFF)
eccodes-threads = []      # POSIX threads support
eccodes-omp-threads = []  # OpenMP threads support

[dependencies]
eckit-sys = { workspace = true, default-features = false }

[build-dependencies]
bindman-utils.workspace = true
bindgen = "0.72"
fs_extra = "1.3"

[package.metadata.docs.rs]
